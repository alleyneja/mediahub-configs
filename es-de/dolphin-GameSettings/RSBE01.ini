# Super Smash Bros. Brawl (USA) -- RSBE01
#
# Brawl accepts a GameCube controller, which is the better pad for it. But the
# emulated Wii Remote and the GC pad are both bound to the same physical Xbox
# pad, so they compete for player slot 1 and the Wii Remote wins -- which is
# why the left stick did nothing (a real remote has no stick; direction is the
# D-pad) and A/B did not line up.
#
# Per-game override: no Wii Remote for this title, GC controller on port 1.
# Pointer games (Wii Play, Wii Sports) are unaffected -- they keep the global
# emulated Wii Remote.
[Controls]
WiimoteSource0 = 0
PadType0 = 6
