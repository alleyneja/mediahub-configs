# Sunshine creates sink-sunshine-stereo on client connect and makes it the
# default output, so that is where apps actually play. Capturing the custom
# sunshine-sink null sink instead recorded silence for anything launched
# AFTER a client connected. Capture the sink Sunshine itself manages.
# (virtual_sink = sunshine-sink was tried first and is ignored by Sunshine.)
audio_sink = sink-sunshine-stereo
# Sunshine only trusts https://localhost, 127.0.0.1 and [::1] by default.
# Every other way of reaching the Web UI must be listed here or it 403s with
# a CSRF error. Entries MUST start with https:// or they are silently rejected.
csrf_allowed_origins = https://100.104.43.6:47990,https://mediahub-production.tail3b4ccf.ts.net:47990,https://mediahub-production:47990,https://192.168.0.21:47990,https://mediahub-production.lan:47990
# X11 capture returns an all-black framebuffer on the NVIDIA driver: XGetImage and
# XShm both read zero pixels even with visible windows, so x11 is not an option here.
# NvFBC works, but only when nvidia_drm modeset=0 — with KMS enabled it fails with
# "Cannot create capture session: the display server is in modeset". That is set in
# /etc/modprobe.d/nvidia-graphics-drivers-kms.conf and baked into the initramfs, and
# GDM is disabled so nothing reloads nvidia_drm with modeset=1 behind our back.
# The DP1080P60 dummy plug on DFP-5 supplies the real EDID and scanout NvFBC needs.
capture = nvfbc
