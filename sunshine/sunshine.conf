audio_sink = sunshine-sink
# Sunshine only trusts https://localhost, 127.0.0.1 and [::1] by default.
# Every other way of reaching the Web UI must be listed here or it 403s with
# a CSRF error. Entries MUST start with https:// or they are silently rejected.
csrf_allowed_origins = https://100.104.43.6:47990,https://mediahub-production.tail3b4ccf.ts.net:47990,https://mediahub-production:47990,https://192.168.0.21:47990,https://mediahub-production.lan:47990
# NvFBC refuses a synthetic display: "Cannot create capture session: the display
# server is in modeset". The P400's monitor is a fabricated ConnectedMonitor with
# no real scanout, so force X11 capture. NVENC + CUDA still run on the P400.
capture = x11
