# The GTK portal backend is itself a GTK app and needs an X display to start.
# The headless session lives on :1 with a non-default auth file, and the systemd
# --user manager inherits neither, so the backend died with "cannot open display".
# That cascaded: portal.Desktop waited 90s for its gtk impl, failed, and every Qt
# app (PCSX2, Dolphin) then stalled 120s on portal activation before mapping.
[Service]
Environment=DISPLAY=:1
Environment=XAUTHORITY=/etc/X11/headless.xauth
