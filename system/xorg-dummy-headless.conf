# Software dummy display for :1 (interim, until the mini-DP dummy plug arrives).
#
# Why: the NVIDIA ConnectedMonitor trick renders fine but its framebuffer cannot
# be read back -- every capture returns pure black, because no DRM connector is
# enabled and nothing ever reaches a scanout engine. The dummy driver keeps its
# framebuffer in system RAM, so captures work.
#
# Cost: apps must render on the P400 via Vulkan/offload and get blitted back to
# a CPU framebuffer -- a round trip the real dummy plug avoids.
# Revert: point xorg-headless.service back at /etc/X11/xorg-p400-headless.conf.

Section "Monitor"
    Identifier  "DummyMonitor"
    HorizSync   28.0-90.0
    VertRefresh 48.0-75.0
    Modeline "1920x1080_60.00" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Device"
    Identifier  "DummyDevice"
    Driver      "dummy"
    VideoRam    256000
EndSection

Section "Screen"
    Identifier  "DummyScreen"
    Device      "DummyDevice"
    Monitor     "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60.00"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "DummyLayout"
    Screen 0    "DummyScreen"
EndSection
