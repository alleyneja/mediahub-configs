# Accept IPv6 router advertisements even though forwarding is on.
#
# 2026-08-22: mediahub had no global IPv6 while every other LAN device did.
# Linux ignores RAs when forwarding=1 unless accept_ra=2, and Tailscale turns on
# IPv6 forwarding for subnet routing -- so enabling the subnet route silently
# killed this host's own IPv6.
#
# Why it matters: T-Mobile is IPv6-native and reaches IPv4 only through CGNAT
# (464XLAT). With no IPv6 here, Tailscale was forced onto that translated path,
# which measured 0-16% loss and 0.2-0.6 Mbps while Ookla did 250 Mbps over v6.
# Restoring IPv6 lets Tailscale connect phone<->server natively and skip CGNAT.
#
# Revert: delete this file, set accept_ra back to 1.
net.ipv6.conf.enp3s0.accept_ra = 2
