# /etc/systemd/system/apt-daily-upgrade.service.d/50-restart-report.conf (all three machines)
# After every daily unattended-upgrades run, report to Discord which services the updates restarted and which are
# waiting for the maintenance window. docs/os-updates.md section F, alleyneja/mediahub-issues#53.
# ExecStopPost (not ExecStartPost) so it also reports when the upgrade run fails part-way; "-" so a failed report
# never marks the upgrade itself as failed.
[Service]
ExecStopPost=-/home/jay/mediahub-configs/scripts/update-restart-report.sh
