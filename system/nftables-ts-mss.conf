#!/usr/sbin/nft -f
#
# TCP MSS clamping for Tailscale traffic.
#
# 2026-08-21: measured path MTU to a T-Mobile cellular peer (jays-iphone) is
# 1260 bytes inner. tailscale0 is set to MTU 1280 and cannot go lower -- IPv6
# has a hard 1280 minimum link MTU, and dropping below it in Aug 2026 removed
# the v6 address from the interface and blackholed every service off-wifi.
#
# So instead of touching the interface, clamp TCP MSS. This is a TCP-level
# constraint, so it is legal below the IPv6 floor and leaves addressing alone.
#
#   inner budget 1240 (20B margin under the measured 1260 wall)
#   IPv4 MSS = 1240 - 20 (IP)   - 20 (TCP) = 1200
#   IPv6 MSS = 1240 - 40 (IPv6) - 20 (TCP) = 1180
#
# prerouting rewrites the MSS a remote peer advertises to us, which caps what
# THIS host sends. postrouting rewrites what we advertise, capping what the
# peer sends. Both are needed.
#
# Interfaces are matched by name (iifname/oifname), not index, so the rules
# keep working when tailscaled recreates tailscale0.
#
# Revert:  sudo nft delete table inet ts-mss
# Disable: sudo systemctl disable --now ts-mss-clamp.service

table inet ts-mss {
	chain prerouting {
		type filter hook prerouting priority mangle; policy accept;
		iifname "tailscale0" meta nfproto ipv4 tcp flags syn / syn,rst counter tcp option maxseg size set 1200
		iifname "tailscale0" meta nfproto ipv6 tcp flags syn / syn,rst counter tcp option maxseg size set 1180
	}
	chain postrouting {
		type filter hook postrouting priority mangle; policy accept;
		oifname "tailscale0" meta nfproto ipv4 tcp flags syn / syn,rst counter tcp option maxseg size set 1200
		oifname "tailscale0" meta nfproto ipv6 tcp flags syn / syn,rst counter tcp option maxseg size set 1180
	}
}
