# /etc/needrestart/conf.d/50-fleet-defer.conf (production only: r9 and staging don't have needrestart)
# Services needrestart must NOT restart during the daily unattended-upgrades run. They wait for the maintenance
# window instead (scripts/maintenance-window.sh restarts them there). docs/os-updates.md section F,
# alleyneja/mediahub-issues#53.
#   tailscaled: restarting it drops every open Tailscale SSH session (happened 2026-09-26 07:00 after a libaudit update)
#   xorg-headless, openbox-headless, sunshine: the Sunshine display stack. sunshine Requires= xorg-headless, so
#     restarting Xorg alone (e.g. an xserver-xorg-core update) also drops any Moonlight stream.
# Keep this list in sync with DEFERRED_RE in scripts/maintenance-window.sh.
$nrconf{override_rc}{qr(^tailscaled\.service$)} = 0;
$nrconf{override_rc}{qr(^xorg-headless\.service$)} = 0;
$nrconf{override_rc}{qr(^openbox-headless\.service$)} = 0;
$nrconf{override_rc}{qr(^sunshine\.service$)} = 0;
