# BBR congestion control, enabled 2026-08-22.
#
# Why: measured 7.5-16% packet loss on the cellular leg to Jay's phone over the
# tailnet (control: 0% to a LAN peer over the same tunnel, so it is the radio
# link, not the server or Tailscale). CUBIC treats every loss as congestion and
# backs off, which collapsed throughput to 14-22 KB/s -- Caddy logged 1 MB files
# truncating after 232-798 KB and 11-56 seconds.
#
# BBR models bandwidth and RTT instead of interpreting loss as congestion, so it
# sustains throughput on lossy radio links. On clean LAN paths it performs at
# least as well as CUBIC.
#
# Revert: delete this file, `sysctl -w net.ipv4.tcp_congestion_control=cubic`.
net.ipv4.tcp_congestion_control = bbr
