# AdGuard (local, filtered) first; 1.1.1.1 is an availability fallback only.
# Tradeoff accepted 2026-08-22: if AdGuard is down the server resolves unfiltered
# rather than not at all. See mediahub-configs/docs/network-architecture.md §4.4.
nameserver 127.0.0.1
nameserver 1.1.1.1
options timeout:1 attempts:2
