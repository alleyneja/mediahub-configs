# Virtual audio sink for Sunshine to capture.
# This host has no physical audio output in use, so Sunshine has nothing to
# record without a null sink. Games launched on :1 play into "sunshine-sink"
# and Sunshine streams its monitor to Moonlight.
context.objects = [
  { factory = adapter
    args = {
      factory.name            = support.null-audio-sink
      node.name               = "sunshine-sink"
      node.description        = "Sunshine Virtual Sink"
      media.class             = Audio/Sink
      audio.position          = [ FL FR ]
      monitor.channel-volumes = true
      node.pause-on-idle      = false
    }
  }
]
