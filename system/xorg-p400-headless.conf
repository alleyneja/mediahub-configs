# Headless Xorg config for Quadro P400 (PCI 01:00.0) — display :1, captured by Sunshine.
# Deliberately NOT in xorg.conf.d: this must only ever apply to :1, never a system X.
# Started by xorg-headless.service. GDM is disabled on this host.
# Revert: systemctl disable --now xorg-headless.service and delete this file.

Section "Monitor"
    Identifier  "HeadlessMonitor"
    HorizSync   28.0-90.0
    VertRefresh 48.0-75.0
    Modeline "1920x1080_60.00" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
    Option      "DPMS" "false"
EndSection

Section "Device"
    Identifier  "P400"
    Driver      "nvidia"
    BusID       "PCI:1:0:0"
    Option      "ModeValidation" "AllowNonEdidModes, NoMaxPClkCheck, NoEdidMaxPClkCheck"
EndSection

Section "Screen"
    Identifier  "P400Screen"
    Device      "P400"
    Monitor     "HeadlessMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080_60.00"
    EndSubSection
EndSection

Section "ServerLayout"
    Identifier  "HeadlessLayout"
    Screen 0    "P400Screen"
EndSection

# Added 2026-08-18. The X screen saver blanks the screen after 600s of no INPUT
# (client drawing does not reset it). A blanked screen makes every capture path --
# x11grab, xwd, and NvFBC alike -- return a uniform frame with no content, which is
# what made headless visual verification look permanently broken on the P400. It also
# means an idle ES-DE/Moonlight session goes black on the projector after 10 minutes.
# BlankTime 0 disables it; the other three are DPMS, already off above but set here
# so this holds if DPMS is ever enabled.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
