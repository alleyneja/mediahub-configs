services:
  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "34400:34400"
    volumes:
      - /srv/docker/threadfin/conf:/home/threadfin/conf
      - /tmp/threadfin:/tmp/threadfin
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true
