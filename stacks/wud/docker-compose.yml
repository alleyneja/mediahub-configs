services:
  wud:
    image: getwud/wud:8.3.1
    container_name: wud
    environment:
      TZ: America/Chicago
      # Weekly sweep, Mondays 09:00 -- same cadence Diun used.
      WUD_WATCHER_LOCAL_CRON: "0 9 * * 1"
      # Report on every running container, not just ones with a wud.watch label.
      WUD_WATCHER_LOCAL_WATCHALL: "true"
      WUD_LOG_LEVEL: info
      # --- Pilot: manual, per-container update triggers (2026-09-05) ---
      # AUTO=false means these never fire on their own; they only run when
      # clicked in the UI (or POSTed to the API). INCLUDEBYDEFAULT=false
      # means each trigger applies to NO container except the one explicitly
      # opted in via a `wud.trigger.include=dockercompose.<name>` label on
      # that service -- without it, a single trigger definition would apply
      # to every one of the ~50 containers WUD watches.
      # BACKUP=true keeps a local .back copy of the compose file as a second
      # safety net alongside git.
      WUD_TRIGGER_DOCKERCOMPOSE_STIRLINGPDF_FILE: /home/jay/mediahub-configs/stacks/stirling-pdf/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_STIRLINGPDF_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_STIRLINGPDF_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_STIRLINGPDF_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_JELLYFIN_FILE: /home/jay/mediahub-configs/stacks/jellyfin/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_JELLYFIN_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_JELLYFIN_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_JELLYFIN_BACKUP: "true"
      # Third pilot (2026-09-05): added specifically to get a second real
      # trial of the missing-backup/permission-reset quirks found on
      # jellyfin, since a container with no pending update can't be
      # re-run and the "Test" button uses fake data that never reaches
      # the file-write code path.
      WUD_TRIGGER_DOCKERCOMPOSE_AUDIOBOOKSHELF_FILE: /home/jay/mediahub-configs/stacks/audiobookshelf/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_AUDIOBOOKSHELF_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_AUDIOBOOKSHELF_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_AUDIOBOOKSHELF_BACKUP: "true"
      # Fourth pilot (2026-09-05): homepage, deliberately chosen because its
      # compose file (stacks/uptime-kuma/docker-compose.yml) is SHARED with
      # uptime-kuma, netdata, and glances. Only homepage gets the
      # wud.trigger.include label -- this is the test of whether the
      # dockercompose trigger really only touches the one matching service
      # in a multi-service file, before trusting it anywhere near arr-stack
      # (Radarr/Sonarr/Prowlarr/Bazarr/Lidarr/Seer/Unpackerr all share ONE
      # file there).
      WUD_TRIGGER_DOCKERCOMPOSE_HOMEPAGE_FILE: /home/jay/mediahub-configs/stacks/uptime-kuma/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_HOMEPAGE_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_HOMEPAGE_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_HOMEPAGE_BACKUP: "true"
      # Fifth pilot (2026-09-05): seer (Seerr), inside arr-stack's shared
      # file -- the exact scenario homepage just proved safe. Only seer
      # gets the wud.trigger.include label; Radarr/Sonarr/Prowlarr/Bazarr/
      # Lidarr/Unpackerr in the same file are NOT opted in and must stay
      # untouched by this trigger.
      WUD_TRIGGER_DOCKERCOMPOSE_SEER_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_SEER_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SEER_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SEER_BACKUP: "true"
      # Bucket 1 (2026-09-05): the rest of the two already-proven-safe
      # shared files. Scoping is confirmed via homepage + seer; this is
      # just repeating the same pattern on their remaining siblings.
      WUD_TRIGGER_DOCKERCOMPOSE_NETDATA_FILE: /home/jay/mediahub-configs/stacks/uptime-kuma/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_NETDATA_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_NETDATA_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_NETDATA_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_GLANCES_FILE: /home/jay/mediahub-configs/stacks/uptime-kuma/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_GLANCES_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_GLANCES_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_GLANCES_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_UPTIMEKUMA_FILE: /home/jay/mediahub-configs/stacks/uptime-kuma/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_UPTIMEKUMA_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_UPTIMEKUMA_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_UPTIMEKUMA_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_RADARR_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_RADARR_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_RADARR_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_RADARR_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_SONARR_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_SONARR_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SONARR_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SONARR_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_PROWLARR_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_PROWLARR_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_PROWLARR_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_PROWLARR_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_BAZARR_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_BAZARR_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_BAZARR_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_BAZARR_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_LIDARR_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_LIDARR_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_LIDARR_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_LIDARR_BACKUP: "true"
      WUD_TRIGGER_DOCKERCOMPOSE_UNPACKERR_FILE: /home/jay/mediahub-configs/stacks/arr-stack/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_UNPACKERR_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_UNPACKERR_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_UNPACKERR_BACKUP: "true"
      # First bucket-2-adjacent pilot (2026-09-05): scanopy's `server`
      # service only. Its postgres is already major-version pinned
      # (wud.tag.include), and server itself holds no real state -- the
      # data lives in the protected DB -- so this is mechanically closer
      # to the bucket-1 pattern than to nextcloud/immich/authentik.
      # scanopy-daemon and scanopy-postgres-1 must NOT be opted in here.
      WUD_TRIGGER_DOCKERCOMPOSE_SCANOPYSERVER_FILE: /home/jay/mediahub-configs/stacks/scanopy/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_SCANOPYSERVER_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SCANOPYSERVER_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_SCANOPYSERVER_BACKUP: "true"
      # First pilot on a real database itself (2026-09-06): couchdb, the
      # Obsidian LiveSync backend. Own dedicated file, no siblings to
      # protect -- the risk here isn't scoping, it's that this IS the data.
      # wud.tag.include on the service already constrains WUD to plain 3.x
      # (blocks the 3.5-nouveau variant and any major jump).
      WUD_TRIGGER_DOCKERCOMPOSE_COUCHDB_FILE: /home/jay/mediahub-configs/stacks/obsidian-sync/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_COUCHDB_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_COUCHDB_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_COUCHDB_BACKUP: "true"
      # mealie (2026-09-06): same-major-line bump (v3.23.1 -> v3.25.1), own
      # dedicated file. mealie-postgres in the same file is NOT opted in --
      # it already has its own wud.tag.include major-line guard and no
      # trigger, consistent with every other DB in this setup.
      WUD_TRIGGER_DOCKERCOMPOSE_MEALIE_FILE: /home/jay/mediahub-configs/stacks/mealie/docker-compose.yml
      WUD_TRIGGER_DOCKERCOMPOSE_MEALIE_AUTO: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_MEALIE_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_DOCKERCOMPOSE_MEALIE_BACKUP: "true"
    volumes:
      # Read-write as of 2026-09-05: required for the manual update triggers
      # below to actually pull/recreate containers, not just read tags.
      # This is a real privilege change -- anything with access to the WUD
      # container (or wud.lan, gated only by the tailnet, same as
      # Vaultwarden/Portainer) can now control any container on the host,
      # not just the two pilots. See feedback_no_blanket_autoupdate + the
      # WUD pilot conversation (2026-09-05) for why this is scoped so
      # tightly on the trigger side.
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind the pilot stacks' whole DIRECTORIES in at their real host path
      # (matching each container's own com.docker.compose.project.config_files
      # label), not just the compose file. Mounting a single file makes Docker
      # synthesize a container-only directory around it -- anything WUD then
      # writes there (like the .back backup) lands inside WUD's own writable
      # layer, invisible on the host and wiped on WUD's next redeploy. See
      # the 2026-09-05 pilot conversation: confirmed .back files were being
      # created, just never surfacing here, because of this exact mistake.
      - /home/jay/mediahub-configs/stacks/stirling-pdf:/home/jay/mediahub-configs/stacks/stirling-pdf
      - /home/jay/mediahub-configs/stacks/jellyfin:/home/jay/mediahub-configs/stacks/jellyfin
      - /home/jay/mediahub-configs/stacks/audiobookshelf:/home/jay/mediahub-configs/stacks/audiobookshelf
      - /home/jay/mediahub-configs/stacks/uptime-kuma:/home/jay/mediahub-configs/stacks/uptime-kuma
      # NOTE: this directory also holds .env and discord.env with real
      # Radarr/Sonarr/etc API keys and a webhook URL. WUD already has full
      # docker-socket control (root-equivalent host access), so this is a
      # marginal increase in exposure, not a new category of risk -- but
      # worth knowing this trigger's blast radius includes those secrets.
      - /home/jay/mediahub-configs/stacks/arr-stack:/home/jay/mediahub-configs/stacks/arr-stack
      - /home/jay/mediahub-configs/stacks/scanopy:/home/jay/mediahub-configs/stacks/scanopy
      - /home/jay/mediahub-configs/stacks/obsidian-sync:/home/jay/mediahub-configs/stacks/obsidian-sync
      - /home/jay/mediahub-configs/stacks/mealie:/home/jay/mediahub-configs/stacks/mealie
      - /srv/docker/visibility/wud:/store
    networks:
      - mediahub_internal
    restart: unless-stopped

networks:
  mediahub_internal:
    external: true
