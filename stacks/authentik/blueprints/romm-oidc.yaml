# RomM OIDC provider + application.
# Created 2026-08-18 so Jay and Mafe can each sign into RomM as themselves and get
# per-user saves/states (romm.saves and romm.states both key on user_id).
#
# This is a BLUEPRINT rather than UI clicks on purpose: it is declarative, it lives in
# mediahub-configs, and it re-applies itself if authentik is ever rebuilt. authentik's
# worker discovers everything under /blueprints/custom automatically.
#
# The client id/secret come from authentik's environment via the !Env tag, NOT from
# this file -- mediahub-configs is a PUBLIC repo and must never carry the secret.
# They are set in the authentik stack.env as ROMM_OIDC_CLIENT_ID / _SECRET and passed
# through to both authentik-server and authentik-worker in the compose file.
version: 1
metadata:
  name: romm-oidc
  labels:
    blueprints.goauthentik.io/description: RomM OAuth2/OIDC provider and application
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: romm-provider
    identifiers:
      name: RomM
    attrs:
      name: RomM
      client_type: confidential
      client_id: !Env ROMM_OIDC_CLIENT_ID
      client_secret: !Env ROMM_OIDC_CLIENT_SECRET
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - url: https://romm.lan/api/oauth/openid
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
  - model: authentik_core.application
    identifiers:
      slug: romm
    attrs:
      name: RomM
      slug: romm
      provider: !KeyOf romm-provider
      meta_description: Retro game library. Play GBA/NES/SNES/Genesis in the browser.
