services:
  authentik-postgres:
    image: postgres:16-alpine
    container_name: authentik-postgres
    labels:
      # Constrain WUD to the Postgres 16 line; otherwise it proposes 19beta3-trixie. This DB backs SSO for every service - a major upgrade is a planned migration.
      - wud.tag.include=^16(\.\d+)*-alpine$$
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
    volumes:
      - /srv/docker/authentik/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mediahub_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  authentik-redis:
    image: redis:7-alpine
    container_name: authentik-redis
    labels:
      # Constrain WUD to the Redis 7 line; otherwise 32bit-stretch is reported as an update.
      - wud.tag.include=^7(\.\d+)*-alpine$$
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - /srv/docker/authentik/redis:/data
    restart: unless-stopped
    networks:
      - mediahub_internal

  authentik-server:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-server
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # Consumed by /blueprints/custom/romm-oidc.yaml via the !Env tag, so the
      # blueprint itself carries no secrets and is safe in the public repo.
      ROMM_OIDC_CLIENT_ID: ${ROMM_OIDC_CLIENT_ID}
      ROMM_OIDC_CLIENT_SECRET: ${ROMM_OIDC_CLIENT_SECRET}
      AUTHENTIK_HOST: https://auth.lan
      AUTHENTIK_HOST_BROWSER: https://auth.lan
    volumes:
      - /srv/docker/authentik/media:/media
      - /srv/docker/authentik/certs:/certs
      # Custom blueprints (RomM OIDC). authentik discovers everything under here.
      - /srv/docker/authentik/blueprints:/blueprints/custom:ro
    ports:
      - "9001:9000"
      - "9444:9443"
    networks:
      - mediahub_internal
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2024.12.3
    container_name: authentik-worker
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      # Consumed by /blueprints/custom/romm-oidc.yaml via the !Env tag, so the
      # blueprint itself carries no secrets and is safe in the public repo.
      ROMM_OIDC_CLIENT_ID: ${ROMM_OIDC_CLIENT_ID}
      ROMM_OIDC_CLIENT_SECRET: ${ROMM_OIDC_CLIENT_SECRET}
    volumes:
      - /srv/docker/authentik/media:/media
      - /srv/docker/authentik/certs:/certs
      - /srv/docker/authentik/blueprints:/blueprints/custom:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - mediahub_internal
    restart: unless-stopped

networks:
  mediahub_internal:
    external: true