services:

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    dns:
      - ${SERVER_IP}
    environment:
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - /srv/docker/visibility/uptime-kuma:/app/data
    extra_hosts:
      - "${TAILSCALE_HOSTNAME}:${TAILSCALE_IP}"
      # Route all .lan domains to Caddy's Docker IP (100.104.43.6 is unreachable from Docker bridge)
      - "vaultwarden.lan:172.18.0.200"
      - "auth.lan:172.18.0.200"
      - "nextcloud.lan:172.18.0.200"
      - "immich.lan:172.18.0.200"
      - "calibre-web.lan:172.18.0.200"
      - "calibre-content.lan:172.18.0.200"
      - "audiobookshelf.lan:172.18.0.200"
      - "bookshelf-ebooks.lan:172.18.0.200"
      - "bookshelf-audiobooks.lan:172.18.0.200"
      - "plex.lan:172.18.0.200"
      - "jellyfin.lan:172.18.0.200"
      - "aurral.lan:172.18.0.200"
      - "sonarr.lan:172.18.0.200"
      - "radarr.lan:172.18.0.200"
      - "lidarr.lan:172.18.0.200"
      - "prowlarr.lan:172.18.0.200"
      - "bazarr.lan:172.18.0.200"
      - "seer.lan:172.18.0.200"
      - "sabnzbd.lan:172.18.0.200"
      - "qbittorrent.lan:172.18.0.200"
      - "portainer.lan:172.18.0.200"
      - "adguard.lan:172.18.0.200"
      - "uptimekuma.lan:172.18.0.200"
      - "netdata.lan:172.18.0.200"
      - "glances.lan:172.18.0.200"
      - "scanopy.lan:172.18.0.200"
      - "homepage.lan:172.18.0.200"
      - "romm.lan:172.18.0.200"
      - "pterodactyl.lan:172.18.0.200"
    ports:
      - "3003:3001"
    networks:
      - mediahub_internal

  netdata:
    image: netdata/netdata:latest
    container_name: netdata
    restart: unless-stopped
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/docker/visibility/netdata/config:/etc/netdata
      - /srv/docker/visibility/netdata/lib:/var/lib/netdata
      - /srv/docker/visibility/netdata/cache:/var/cache/netdata
      - /mnt/media:/host/mnt/media:ro
    ports:
      - "19999:19999"
    networks:
      - mediahub_internal

  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    volumes:
      - /srv/docker/visibility/diun:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOG_LEVEL=info
      - LOG_JSON=false
      - DIUN_WATCH_WORKERS=20
      - DIUN_WATCH_SCHEDULE=0 9 * * 1
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true
    networks:
      - mediahub_internal

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    pid: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/media:/mnt/media:ro
      - /sys/class/hwmon:/sys/class/hwmon:ro
      - /sys/class/thermal:/sys/class/thermal:ro
      - /run/udev:/run/udev:ro
      - /srv/docker/visibility/glances:/etc/glances:ro
    environment:
      - GLANCES_OPT=-w --enable-plugin sensors
    ports:
      - "61208:61208"
    networks:
      - mediahub_internal

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3080:3000"
    extra_hosts:
    - "adguardhome:host-gateway"
    volumes:
      - /srv/docker/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - HOMEPAGE_ALLOWED_HOSTS=${SERVER_IP}:3080,homepage.lan,${TAILSCALE_HOSTNAME}:3080
      # Widget credentials. Portainer's copy of this stack had these HARDCODED
      # in the compose file; this repo is public, so they are parameterised and
      # the real values live in the gitignored .env (see .env.example).
      # Without them every Homepage widget silently renders blank -- the tiles
      # still appear, they just show no data, so it is easy to miss.
      - HOMEPAGE_VAR_ADGUARD_HOME_PASSWORD=${HOMEPAGE_VAR_ADGUARD_HOME_PASSWORD}
      - HOMEPAGE_VAR_ADGUARD_HOME_USERNAME=${HOMEPAGE_VAR_ADGUARD_HOME_USERNAME}
      - HOMEPAGE_VAR_AUDIOBOOKS_BOOKSHELF_KEY=${HOMEPAGE_VAR_AUDIOBOOKS_BOOKSHELF_KEY}
      - HOMEPAGE_VAR_BAZARR_KEY=${HOMEPAGE_VAR_BAZARR_KEY}
      - HOMEPAGE_VAR_EBOOKS_BOOKSHELF_KEY=${HOMEPAGE_VAR_EBOOKS_BOOKSHELF_KEY}
      - HOMEPAGE_VAR_IMMICH_KEY=${HOMEPAGE_VAR_IMMICH_KEY}
      - HOMEPAGE_VAR_LIDARR_KEY=${HOMEPAGE_VAR_LIDARR_KEY}
      - HOMEPAGE_VAR_MEALIE_KEY=${HOMEPAGE_VAR_MEALIE_KEY}
      - HOMEPAGE_VAR_PROWLARR_KEY=${HOMEPAGE_VAR_PROWLARR_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${HOMEPAGE_VAR_QBITTORRENT_PASSWORD}
      - HOMEPAGE_VAR_QBITTORRENT_USERNAME=${HOMEPAGE_VAR_QBITTORRENT_USERNAME}
      - HOMEPAGE_VAR_RADARR_KEY=${HOMEPAGE_VAR_RADARR_KEY}
      - HOMEPAGE_VAR_SABNZBD_KEY=${HOMEPAGE_VAR_SABNZBD_KEY}
      - HOMEPAGE_VAR_SEERR_KEY=${HOMEPAGE_VAR_SEERR_KEY}
      - HOMEPAGE_VAR_SONARR_KEY=${HOMEPAGE_VAR_SONARR_KEY}
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true