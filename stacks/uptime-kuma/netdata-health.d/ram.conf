# Fleet override (2026-09-25): alert on real memory pressure, not on how full swap is. Swap on production sits near
# full with idle pages and no swap activity, which is harmless; the stock rule paged Discord for it.
# you can disable an alarm notification by setting the 'to' line to: silent

      alarm: ram_in_use
         on: system.ram
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $used * 100 / ($used + $cached + $free + $buffers)
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (80) : (90))
       crit: $this > (($status == $CRITICAL) ? (90) : (98))
      delay: down 15m multiplier 1.5 max 1h
    summary: System memory utilization
       info: System memory utilization
         to: sysadmin

      alarm: ram_available
         on: mem.available
      class: Utilization
       type: System
  component: Memory
host labels: _os=linux
       calc: $avail * 100 / ($system.ram.used + $system.ram.cached + $system.ram.free + $system.ram.buffers)
      units: %
      every: 10s
       warn: $this < (($status >= $WARNING)  ? (15) : (10))
      delay: down 15m multiplier 1.5 max 1h
    summary: System available memory
       info: Percentage of estimated amount of RAM available for userspace processes, without causing swapping
         to: sysadmin

      alarm: oom_kill
         on: mem.oom_kill
host labels: _os=linux
     lookup: sum -30m unaligned
      units: kills
      every: 5m
       warn: $this > 0
      delay: down 10m
    summary: System OOM kills
       info: Number of out of memory kills in the last 30 minutes
         to: sysadmin

## FreeBSD
      alarm: ram_in_use
         on: system.ram
      class: Utilization
       type: System
  component: Memory
host labels: _os=freebsd
       calc: ($active + $wired + $laundry + $buffers) * 100 / ($active + $wired + $laundry + $buffers + $cache + $free + $inactive)
      units: %
      every: 10s
       warn: $this > (($status >= $WARNING)  ? (80) : (90))
       crit: $this > (($status == $CRITICAL) ? (90) : (98))
      delay: down 15m multiplier 1.5 max 1h
    summary: System memory utilization
       info: System memory utilization
         to: sysadmin

      alarm: ram_available
         on: mem.available
      class: Utilization
       type: System
  component: Memory
host labels: _os=freebsd
       calc: $avail * 100 / ($system.ram.free + $system.ram.active + $system.ram.inactive + $system.ram.wired + $system.ram.cache + $system.ram.laundry + $system.ram.buffers)
      units: %
      every: 10s
       warn: $this < (($status >= $WARNING)  ? (15) : (10))
      delay: down 15m multiplier 1.5 max 1h
    summary: System available memory
       info: Percentage of estimated amount of RAM available for userspace processes, without causing swapping
         to: sysadmin
