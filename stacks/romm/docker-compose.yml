services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
      - DB_HOST=romm-db
      - DB_NAME=romm
      - DB_USER=romm-user
      - DB_PASSWD=${ROMM_DB_PASSWORD}
      - IGDB_CLIENT_ID=${IGDB_CLIENT_ID}
      - IGDB_CLIENT_SECRET=${IGDB_CLIENT_SECRET}
      - ROMM_AUTH_SECRET_KEY=${ROMM_AUTH_SECRET_KEY}
      # OIDC via Authentik (added 2026-08-18) so Jay and Mafe each sign in as
      # themselves; romm.saves and romm.states key on user_id, so this is what
      # gives them independent saves. Local admin login stays enabled on purpose
      # (DISABLE_USERPASS_LOGIN is not set) -- do not lock out the break-glass user.
      - OIDC_ENABLED=true
      - OIDC_PROVIDER=authentik
      - OIDC_CLIENT_ID=${ROMM_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${ROMM_OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=https://romm.lan/api/oauth/openid
      - OIDC_SERVER_APPLICATION_URL=https://auth.lan/application/o/romm
      # Caddy signs *.lan with its own internal CA, which nothing in the container
      # trusts by default. Without this, authlib's metadata fetch fails TLS
      # verification and the OIDC login dies before it reaches Authentik.
      - OIDC_TLS_CACERTFILE=/certs/caddy-root.crt
    volumes:
      - /srv/docker/caddy/data/caddy/pki/authorities/local/root.crt:/certs/caddy-root.crt:ro
      - /mnt/internal/arcade:/romm/library
      - /mnt/media/games/roms/switch:/romm/library/roms/switch
      - romm-resources:/romm/resources
      - romm-redis-data:/redis-data
    ports:
      - "8084:8080"
    networks:
      - default
      - mediahub_internal
    depends_on:
      romm-db:
        condition: service_healthy

  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${ROMM_MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=romm
      - MYSQL_USER=romm-user
      - MYSQL_PASSWORD=${ROMM_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      timeout: 5s
      retries: 5

networks:
  mediahub_internal:
    external: true

volumes:
  romm-resources:
  romm-redis-data:
  mysql-data:
