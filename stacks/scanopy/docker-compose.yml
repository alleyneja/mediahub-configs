name: scanopy
services:
  daemon:
    image: ghcr.io/scanopy/scanopy/daemon:latest
    container_name: scanopy-daemon
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_SERVER_URL: http://127.0.0.1:60072
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:60073/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - daemon-config:/root/.config/daemon
      - /var/run/docker.sock:/var/run/docker.sock:ro
  postgres:
    image: postgres:17-alpine
    labels:
      # Constrain WUD to the Postgres 17 line. Without it, 19beta3-trixie is
      # reported as an update: a beta, on a different base OS, two majors ahead.
      # A Postgres major upgrade needs pg_upgrade -- never a click-to-update.
      - wud.tag.include=^17(\.\d+)*-alpine$$
    environment:
      POSTGRES_DB: scanopy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scanopy
  server:
    image: ghcr.io/scanopy/scanopy/server:latest
    ports:
      - "60072:60072"
    environment:
      SCANOPY_LOG_LEVEL: ${SCANOPY_LOG_LEVEL:-info}
      SCANOPY_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@scanopy-postgres-1:5432/scanopy
      SCANOPY_WEB_EXTERNAL_PATH: /app/static
      SCANOPY_PUBLIC_URL: ${SCANOPY_PUBLIC_URL:-http://localhost:60072}
      SCANOPY_INTEGRATED_DAEMON_URL: http://host.docker.internal:60073
    volumes:
      # Absolute, not ./data. A relative bind resolves against whichever
      # directory holds the compose file, so this silently pointed at
      # Portainer's internal stack dir before 2026-08-23 and would have moved
      # again on every relocation. It also kept service data inside a PUBLIC
      # git repo. Empty in practice -- real state is in the postgres volume.
      - /srv/docker/scanopy/data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      daemon:
        condition: service_started
    restart: unless-stopped
    networks:
      - scanopy
      - mediahub_internal
volumes:
  postgres_data:
  daemon-config:
networks:
  scanopy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16
          gateway: 172.31.0.1
  mediahub_internal:
    external: true
