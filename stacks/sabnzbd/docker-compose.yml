version: "3.9"

services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    networks:
      - mediahub_internal
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "8080:8080"
    volumes:
      - /srv/docker/sabnzbd:/config
      - /mnt/media:/data
      # In-progress downloads live on the NVMe. SAB writes thousands of small
      # article fragments here, which is the workload FUSE handles worst.
      # NOTE: completed downloads must stay on /data (the pool) so they land on
      # the same device as the library — that is what lets the *arr apps
      # hardlink on import instead of physically copying. See
      # docs/download-storage-layout.md.
      - /srv/downloads/incomplete:/incomplete

networks:
  mediahub_internal:
    external: true