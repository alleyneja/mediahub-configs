# Plex on mediahub-r9: the ONLY Plex server (docs/fleet-architecture.md). Live since the Phase 3 cutover, 2026-09-21.
# The old production stack (stacks/plex, Quadro P400) was retired 2026-11-15 and removed from the repo; its last
# version is in git history (`git log --diff-filter=D -- stacks/plex`). i7's config was archived at
# /srv/archive/plex-i7-config-2026-11-15.tar.zst on mediahub-i7 (delete after 2026-12-15 if r9 stays fine).
# Differences from that old stack:
#   - Live TV: Threadfin stays on production for now, so the name points there.
#   - GPU: the RTX 5070 Ti (production had the Quadro P400).
# NEVER run a second Plex with the same config/identity: they share ONE server identity and would fight over plex.tv.
services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    cpus: "4"
    # Host networking, same reason as production: Plex must advertise the real LAN IP.
    network_mode: host
    extra_hosts:
      - threadfin=192.168.0.21
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - VERSION=docker
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    volumes:
      - /srv/docker/plex:/config
      - /mnt/media:/data/media
    runtime: nvidia
    restart: unless-stopped
