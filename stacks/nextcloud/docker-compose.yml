services:
  postgres:
    image: postgres:16-alpine
    container_name: nextcloud-postgres
    labels:
      # Constrain WUD to the Postgres 16 line; otherwise it proposes 19beta3-trixie. Major upgrades need pg_upgrade.
      - wud.tag.include=^16(\.\d+)*-alpine$$
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
    volumes:
      - /srv/docker/nextcloud/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mediahub_internal

  redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    labels:
      # Constrain WUD to the Redis 7 line; otherwise 32bit-stretch is reported as an update.
      - wud.tag.include=^7(\.\d+)*-alpine$$
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - /srv/docker/nextcloud/redis:/data
    restart: unless-stopped
    networks:
      - mediahub_internal

  nextcloud:
    image: nextcloud:31-apache
    container_name: nextcloud
    labels:
      # Two problems without this: WUD proposes 34-fpm-alpine, which (a) switches the variant from apache to fpm-alpine, a different serving model this stack is not configured for, and (b) jumps five majors at once. Nextcloud majors MUST be applied sequentially - 29 to 30 to 31 - so only the next valid hop is allowed here. BUMP THIS RANGE after each major upgrade, or WUD will go quiet about Nextcloud entirely.
      - wud.tag.include=^(30|31)-apache$$
      # Opt into the manual dockercompose trigger defined in
      # stacks/wud/docker-compose.yml (2026-09-06). nextcloud-cron below is
      # deliberately NOT opted in -- see the trigger's comment in wud's
      # compose file for why. Bump cron's tag by hand after using this one.
      - wud.trigger.include=dockercompose.nextcloud
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8081:80"   # Staging port (8080 reserved for SABnzbd)
    dns:
      - ${SERVER_IP}
    environment:
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}

      POSTGRES_HOST: nextcloud-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://nextcloud.lan
      TRUSTED_PROXIES: 172.20.0.0/16
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/caddy-root.crt
      REDIS_HOST: nextcloud-redis
      # Apache runs as www-data with PRIMARY group 10 ("uucp" in this image = NAS "admin" gid). The NAS media share's
      # UGREEN ACL admits only gid 10 and uid 1000; www-data (33) alone is refused, which caused the Sep 13-14, Sep 23
      # and Sep 25 2026 "data directory invalid" outages (D12). It must be the primary group: mergerfs only sees the
      # caller's primary gid reliably (supplementary groups are cached per thread). Run occ as `-u www-data:uucp`.
      APACHE_RUN_GROUP: uucp
    volumes:
      - /srv/docker/nextcloud/html:/var/www/html
      - /mnt/media/nextcloud/data:/var/www/html/data
      - /srv/docker/caddy/caddy-root.crt:/etc/ssl/certs/caddy-root.crt:ro
    restart: unless-stopped
    networks:
      - mediahub_internal

  # Runs cron.php every 5 min. Without this the stack falls back to AJAX mode,
  # where background jobs only fire on a web-UI page load - so an iOS-only user
  # never runs them. Aug 28 2026: ScanFiles had not run since May 29 and
  # UploadCleanup had never run at all, leaving filecache drifted from disk and
  # chunked-upload sessions stranded. Image tag MUST match the nextcloud service.
  cron:
    image: nextcloud:31-apache
    container_name: nextcloud-cron
    labels:
      - wud.tag.include=^(30|31)-apache$$
    # 33:10 for the same NAS-ACL reason as APACHE_RUN_GROUP above. busybox crond (/cron.sh) would run the job with
    # www-data's primary group 33, so a plain loop replaces it (2026-09-25).
    user: "33:10"
    entrypoint: ["sh", "-c", "while true; do php -f /var/www/html/cron.php; sleep 300; done"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      POSTGRES_HOST: nextcloud-postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_POSTGRES_PASSWORD}
      REDIS_HOST: nextcloud-redis
    volumes:
      - /srv/docker/nextcloud/html:/var/www/html
      - /mnt/media/nextcloud/data:/var/www/html/data
      - /srv/docker/caddy/caddy-root.crt:/etc/ssl/certs/caddy-root.crt:ro
    restart: unless-stopped
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true