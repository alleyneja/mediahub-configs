version: "3.9"

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    cpus: "4"
    # Host networking so Plex advertises the real LAN IP (192.168.0.21) to
    # plex.tv and exposes GDM discovery. Under bridge networking it only saw
    # the docker-internal 172.x IP, so clients (phone app, app.plex.tv) got
    # "server unreachable" after any container restart.
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - /srv/docker/plex:/config
      - /mnt/media:/data/media
    runtime: nvidia
    restart: unless-stopped
