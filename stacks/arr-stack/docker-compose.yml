services:
  prowlarr:
    # Docker Hub mirror, not lscr.io -- WUD has no registry provider for
    # lscr.io, so it can't see updates there at all. Verified 2026-09-05:
    # identical manifest digest on lscr.io/docker.io/ghcr.io for this image.
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    labels:
      - wud.trigger.include=dockercompose.prowlarr
      - wud.watch.digest=true
    networks: [mediahub_internal]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "9696:9696"
    volumes:
      - /srv/docker/prowlarr:/config
      - /mnt/media:/data

  radarr:
    # Docker Hub mirror, not lscr.io -- see prowlarr's comment above.
    image: linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    labels:
      - wud.trigger.include=dockercompose.radarr
      - wud.watch.digest=true
    networks: [mediahub_internal]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "7878:7878"
    volumes:
      - /srv/docker/radarr:/config
      - /mnt/media:/data
      - ./scripts:/config/scripts:ro
      - ./discord.env:/config/discord.env:ro

  sonarr:
    # Docker Hub mirror, not lscr.io -- see prowlarr's comment above.
    image: linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    labels:
      - wud.trigger.include=dockercompose.sonarr
      - wud.watch.digest=true
    networks: [mediahub_internal]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "8989:8989"
    volumes:
      - /srv/docker/sonarr:/config
      - /mnt/media:/data
      - ./scripts:/config/scripts:ro
      - ./discord.env:/config/discord.env:ro

  lidarr:
    # Docker Hub mirror, not lscr.io -- see prowlarr's comment above.
    image: linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    labels:
      - wud.trigger.include=dockercompose.lidarr
      - wud.watch.digest=true
    networks: [mediahub_internal]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "8686:8686"
    volumes:
      - /srv/docker/lidarr:/config
      - /mnt/media:/data

  bazarr:
    # Docker Hub mirror, not lscr.io -- see prowlarr's comment above.
    image: linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    labels:
      - wud.trigger.include=dockercompose.bazarr
      - wud.watch.digest=true
    networks: [mediahub_internal]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "6767:6767"
    volumes:
      - /srv/docker/bazarr:/config
      - /mnt/media:/data
      # Local patch, see patches/gemini_translator.py for why: upstream retries a
      # failed Gemini batch by resending it unchanged, which reliably fails the same
      # way again on long-form/dense content instead of splitting it down. Re-check
      # this against the stock file on every Bazarr version bump.
      - ./patches/gemini_translator.py:/app/bazarr/bin/bazarr/subtitles/tools/translate/services/gemini_translator.py

  seer:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seer
    restart: unless-stopped
    labels:
      # Opt ONLY seer into the manual dockercompose trigger defined in
      # stacks/wud/docker-compose.yml (2026-09-05). This file is shared
      # with Radarr/Sonarr/Prowlarr/Bazarr/Lidarr/Unpackerr -- do NOT copy
      # this label to them without re-verifying scoping on each one; the
      # homepage/uptime-kuma test proved the mechanism, not every service.
      - wud.trigger.include=dockercompose.seer
    networks: [mediahub_internal]
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    ports:
      - "5055:5055"
    volumes:
      - /srv/docker/seer:/app/config
  # ------------------------------------
  # --------- Unpackerr (Extraction) ---
  # ------------------------------------
  unpackerr:
    image: golift/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    labels:
      - wud.trigger.include=dockercompose.unpackerr
      - wud.watch.digest=true
    networks: [mediahub_internal]
    user: "1000:1000"
    volumes:
      - /srv/docker/unpackerr:/config
      - /mnt/media:/data
    environment:
      - TZ=America/Chicago
      - UN_LOG_FILE=/data/downloads/unpackerr.log
      # Sonarr
      - UN_SONARR_0_URL=http://sonarr:8989
      - UN_SONARR_0_API_KEY=${UN_SONARR_0_API_KEY}
      - UN_SONARR_0_PATHS_0=/data/downloads
      # Radarr
      - UN_RADARR_0_URL=http://radarr:7878
      - UN_RADARR_0_API_KEY=${UN_RADARR_0_API_KEY}
      - UN_RADARR_0_PATHS_0=/data/downloads
      # Lidarr
      - UN_LIDARR_0_URL=http://lidarr:8686
      - UN_LIDARR_0_API_KEY=${UN_LIDARR_0_API_KEY}
      - UN_LIDARR_0_PATHS_0=/data/downloads
      # Bookshelf - Ebooks (Readarr-compatible fork, port 8787)
      - UN_READARR_0_URL=http://bookshelf-ebooks:8787
      - UN_READARR_0_API_KEY=${UN_READARR_0_API_KEY}
      - UN_READARR_0_PATHS_0=/data/downloads
      # Bookshelf - Audiobooks (Readarr-compatible fork, port 8789)
      - UN_READARR_1_URL=http://bookshelf-audiobooks:8787
      - UN_READARR_1_API_KEY=${UN_READARR_1_API_KEY}
      - UN_READARR_1_PATHS_0=/data/downloads
networks:
  mediahub_internal:
    external: true
