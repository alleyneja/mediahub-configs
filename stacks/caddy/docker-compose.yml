services:
  caddy:
    image: caddy:2
    container_name: caddy
    labels:
      # Constrain WUD to plain Caddy 2.x. Without it, 2-windowsservercore-ltsc2025 is reported as an update - a WINDOWS container image, which cannot run here at all.
      - wud.tag.include=^2(\.\d+)*$$
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /srv/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/docker/caddy/data:/data
      - /srv/docker/caddy/config:/config
      - /run/php:/run/php
      - /var/www/pterodactyl:/var/www/pterodactyl
    networks:
      mediahub_internal:
        ipv4_address: 172.18.0.200
    restart: unless-stopped
networks:
  mediahub_internal:
    external: true