# Single-binary Loki, filesystem storage, 90-day retention (issue #71). ~16 MB/day of raw logs across the fleet.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 2160h
  allow_structured_metadata: true
  volume_enabled: true
  # Alloy backfills whatever history Docker still holds on first start: accept samples up to the retention age and
  # allow a bigger burst so it isn't dropped.
  reject_old_samples: true
  reject_old_samples_max_age: 2160h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  per_stream_rate_limit: 8MB
  per_stream_rate_limit_burst: 16MB
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
