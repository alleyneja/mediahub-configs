services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    # Runs as jay (2026-09-25, D12): was implicitly root, which left the library root-owned.
    user: "1000:1000"
    labels:
      # Opt this container into the manual dockercompose trigger defined in
      # stacks/wud/docker-compose.yml (third pilot, 2026-09-05).
      - wud.trigger.include=dockercompose.audiobookshelf
    dns:
      - ${SERVER_IP}
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/caddy-root.crt
    volumes:
      - /mnt/media/audiobooks/bookshelf:/audiobooks
      - /mnt/media/podcasts:/podcasts
      - /srv/docker/audiobookshelf/config:/config
      - /srv/docker/audiobookshelf/metadata:/metadata
      - /srv/docker/caddy/caddy-root.crt:/etc/ssl/certs/caddy-root.crt:ro
    restart: unless-stopped
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true