services:
  lidarr-downloader:
    # Angrido/Lidarr-YouTube-Downloader v2.0.0 (2026-10-15). Docker Hub only
    # publishes :latest/:beta (no version tags), so pinned by digest. Upstream's
    # own compose floats everything with --no-cache builds; deliberately not
    # copied (see feedback_no_blanket_autoupdate). Bump = new digest, reviewed.
    image: angrido/lidarr-downloader@sha256:ec60744f60f0c13363401d4b615b3541188470ea2c3b6d74e77e09fe8db9ba81
    container_name: lidarr-downloader
    restart: unless-stopped
    env_file: stack.env   # LIDARR_API_KEY (gitignored)
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/Chicago
      - LIDARR_URL=http://lidarr:8686
      # Staging only. Direct mode: finished albums are copied into /music and
      # Lidarr is told to rescan. The Newznab/SABnzbd bridge was tried and backed
      # out 2026-10-16: with the real SABnzbd at priority 1, Lidarr routes every
      # usenet-protocol release (incl. the YouTube ones) to it, so the bridge
      # client is never used. Tags can't separate them (they match artists).
      - DOWNLOAD_PATH=/data/downloads/complete/lidarr-ytdl
      - LIDARR_PATH=/music
      - YT_POT_PROVIDER_URL=http://bgutil-provider:4416
      - XML_METADATA_ENABLED=false   # per-track .xml sidecars are clutter for Plex/Lidarr
    volumes:
      # SQLite lives here: must be local disk, never the mergerfs pool (no mmap).
      - /srv/docker/lidarr-ytdl/config:/config
      - /mnt/media/downloads/complete/lidarr-ytdl:/data/downloads/complete/lidarr-ytdl
      # Direct mode writes finished albums here.
      - /mnt/media/music:/music
      # Length check after every download (patches/README.md). Based on the pinned
      # image's processing.py: re-diff against patches/processing.py.orig on any bump.
      - ./patches/processing.py:/app/processing.py:ro
      # One pass first: scheduler queues never-attempted albums before any retry
      # (patches/README.md). Re-diff against patches/scheduler.py.orig on any bump.
      - ./patches/scheduler.py:/app/scheduler.py:ro
    # No login on the web UI: LAN only, never port-forward.
    ports:
      - "5005:5000"
    depends_on:
      - bgutil-provider
    networks:
      - mediahub_internal

  # YouTube PO-token sidecar, avoids "Sign in to confirm you're not a bot".
  # Version matches the bgutil plugin inside the pinned app image (2.0.2).
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    container_name: bgutil-provider
    restart: unless-stopped
    init: true
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true
