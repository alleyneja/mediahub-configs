services:
  mealie-postgres:
    image: postgres:16-alpine
    container_name: mealie-postgres
    labels:
      # Constrain What's Up Docker to the Postgres 16 line. Without this it
      # "helpfully" reports 19beta3-trixie as an available update: a beta, on a
      # different base OS, three majors ahead. A Postgres major upgrade needs
      # pg_upgrade and a planned migration -- it is never a click-to-update.
      # Pinned to the major line so WUD still surfaces real 16.x patch releases.
      - wud.tag.include=^16(\.\d+)*-alpine$$
    environment:
      POSTGRES_USER: mealie
      POSTGRES_DB: mealie
      TZ: America/Chicago
    env_file:
      - mealie.env
    volumes:
      # NVMe only. The mergerfs pool cannot mmap (cache.files=off) and NFS has
      # weak locking/fsync — both corrupt a Postgres data directory.
      # See docs/mergerfs-cache-files-off.md and docs/calibre-library-on-ext4.md.
      - /srv/docker/mealie/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealie -d mealie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediahub_internal
    restart: unless-stopped

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.23.1
    container_name: mealie
    depends_on:
      mealie-postgres:
        condition: service_healthy
    # AdGuard, so the container can resolve auth.lan through Caddy.
    # Do NOT use extra_hosts to pin auth.lan — Caddy's container IP is not
    # stable, and calibre-web is currently broken that way.
    dns:
      - ${SERVER_IP}
    environment:
      TZ: America/Chicago
      PUID: 1000
      PGID: 1000
      BASE_URL: https://mealie.lan
      ALLOW_SIGNUP: "false"
      # Keep the local admin door open alongside SSO, permanently.
      ALLOW_PASSWORD_LOGIN: "true"
      DB_ENGINE: postgres
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: mealie
      POSTGRES_DB: mealie
      OIDC_AUTH_ENABLED: "true"
      OIDC_CONFIGURATION_URL: https://auth.lan/application/o/mealie/.well-known/openid-configuration
      OIDC_PROVIDER_NAME: Authentik
      OIDC_USER_GROUP: mealie-users
      OIDC_ADMIN_GROUP: admin
      OIDC_GROUPS_CLAIM: groups
      OIDC_SIGNUP_ENABLED: "true"
      OIDC_REQUIRES_EMAIL_VERIFICATION: "false"
      # Scoped to the OIDC client ONLY.
      #
      # Do NOT switch this to REQUESTS_CA_BUNDLE. That variable *replaces*
      # Python's trust store rather than adding to it, so pointing it at
      # caddy-root.crt would leave this container trusting Caddy and no public
      # CA — trading working SSO for silently broken recipe URL scraping.
      # calibre-web hit exactly this with cover/metadata lookups; see
      # docs/calibre-web-ca-bundle.md.
      OIDC_TLS_CACERTFILE: /etc/ssl/certs/caddy-root.crt
    env_file:
      - mealie.env
    volumes:
      - /srv/docker/mealie/data:/app/data
      - /srv/docker/caddy/caddy-root.crt:/etc/ssl/certs/caddy-root.crt:ro
    networks:
      - mediahub_internal
    restart: unless-stopped

networks:
  mediahub_internal:
    external: true
