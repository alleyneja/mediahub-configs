version: "3.9"
services:
  vaultwarden:
    image: vaultwarden/server:1.37.2
    container_name: vaultwarden
    environment:
      TZ: America/Chicago
      SIGNUPS_ALLOWED: "false"
      DOMAIN: "https://vaultwarden.lan"
    # ADMIN_TOKEN lives in vaultwarden.env (gitignored) as an Argon2id PHC hash
    env_file:
      - vaultwarden.env
    volumes:
      - /srv/docker/vaultwarden/data:/data
    networks:
      - mediahub_internal
    restart: unless-stopped

networks:
  mediahub_internal:
    external: true