# Whisper ASR on mediahub-r9's GPU, used by Bazarr (production) as a last-resort subtitle
# provider: transcribes audio directly for episodes/movies no database provider has ever
# indexed. Bazarr stays on production; only this GPU-bound step runs on r9 (same split as
# Immich ML, docs/fleet-architecture.md D10).
# Reachable only on r9's Tailscale address (the API has no authentication).
#
# MODEL=small (~2GB VRAM) is a deliberate choice, not the max this GPU could hold: the model
# stays resident in VRAM the whole time the container runs (this image has no idle-unload like
# Immich's MACHINE_LEARNING_MODEL_TTL), and this GPU also does Sunshine game streaming. Bump to
# medium/large-v3 later (edit MODEL, restart) if small's accuracy isn't good enough.
# Pinned to v1.10.0-gpu, not :latest-gpu -- the plain :latest tag is CPU-only torch with no CUDA
# libs at all (confirmed the hard way: libcublas.so.12 missing, every GPU transcription fails).
# Matches the pin-don't-float convention used elsewhere (WUD tag rules, Immich D10).
services:
  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0-gpu
    container_name: whisper-asr
    runtime: nvidia
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=faster_whisper
      - ASR_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TZ=America/Chicago
    volumes:
      - /srv/docker/whisper-asr/model-cache:/root/.cache
    ports:
      - "100.121.244.45:9000:9000"
    restart: unless-stopped
