<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <style>
      circle { filter: url(#blur); opacity: 0.75; }
      .b1 { fill: #6366f1; animation: drift1 3s ease-in-out infinite; }
      .b2 { fill: #ec4899; animation: drift2 3.5s ease-in-out infinite; }
      .b3 { fill: #22d3ee; animation: drift3 4s ease-in-out infinite; }
      @keyframes drift1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(120px, 60px) scale(1.3); }
      }
      @keyframes drift2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-100px, 70px) scale(1.2); }
      }
      @keyframes drift3 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(80px, -60px) scale(1.3); }
      }
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#08090c" />
  <circle class="b1" cx="120" cy="120" r="220" />
  <circle class="b2" cx="880" cy="260" r="210" />
  <circle class="b3" cx="520" cy="880" r="190" />
</svg>
