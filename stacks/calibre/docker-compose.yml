services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    dns:
      - ${SERVER_IP}
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      # REQUESTS_CA_BUNDLE *replaces* Python's trust store, it does not add to
      # it. Pointing it at caddy-root.crt alone left this container trusting
      # only Caddy and no public CA, breaking every cover and metadata lookup.
      # The host bundle already contains the public CAs *and* the Caddy root
      # (setup.sh installs it), so it satisfies both. See docs/calibre-web-ca-bundle.md.
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-bundle-with-caddy.crt
    volumes:
      - /srv/docker/calibre-web/config:/config
      # Bind the ext4 branch directly, NOT the mergerfs pool: cache.files=off
      # means /mnt/media cannot mmap(), and SQLite in WAL mode requires it.
      # See docs/calibre-library-on-ext4.md.
      - /mnt/internal/ebooks/calibre-library:/calibre-library
      # No /ingest bind on purpose. CWA's watcher reads ingest_folder from
      # /app/calibre-web-automated/dirs.json, which is hardcoded to /cwa-book-ingest
      # (an anonymous volume). A bind at /ingest is never watched, so it silently
      # swallowed anything dropped in it. Books reach Calibre via
      # Bookshelf -> calibre-content-server, or the Upload button in the web UI.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-bundle-with-caddy.crt:ro
    extra_hosts:
      - "auth.lan:172.18.0.28"
    networks:
      - mediahub_internal
    restart: unless-stopped

networks:
  mediahub_internal:
    external: true