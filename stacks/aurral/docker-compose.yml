services:
  aurral:
    image: ghcr.io/lklynet/aurral:2.8.0
    container_name: aurral
    labels:
      # Opt into the manual dockercompose trigger defined in
      # stacks/wud/docker-compose.yml (2026-09-06). Version pin lifted
      # 2026-09-06 -- changelog reviewed (v2.0.0 mount change handled
      # below; Lidarr integration redesigned but remains, not replaced;
      # v2.8.0's SQLite artwork persistence + BrainzMASH rate-limiting
      # look like they address the original 2026-06-14 pin reason).
      - wud.trigger.include=dockercompose.aurral
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Default per-request Lidarr client timeout is 30s. The Library
      # sync fetches per-artist track/trackfile data (530 artists x 2
      # calls, concurrency 12) and aborts the ENTIRE sync on any single
      # failure -- most individual failures at 30s were just concurrency
      # contention (confirmed: 7/9 sampled succeeded in 5-8s when retried
      # alone). Raised to give real headroom for load-related slowness.
      # Does NOT fix Beethoven/Mozart specifically (48K/54K-track
      # catalogs -- hung 120s+ even with zero contention, tested alone);
      # those need a separate decision (unmonitoring doesn't exclude them
      # from the sync -- only actually removing them from Lidarr would).
      - LIDARR_TIMEOUT_MS=120000
    volumes:
      - /srv/docker/aurral/data:/app/backend/data
      # v2.x reads from /config instead of /app/backend/data (a real
      # breaking change per the v2.0.0 release notes). Same host folder
      # mounted at both paths so the data is already sitting where a
      # future v2.x expects it -- no separate migration step needed
      # whenever the pin above gets opened up.
      - /srv/docker/aurral/data:/config
      - /mnt/media/music/_aurral_weeklyflow:/data/weeklyflow
      # Narrowed 2026-09-07 from a blanket /mnt/media:/data (which gave
      # Aurral read-write reach over movies/tv/every downloads subfolder,
      # far more than it needs). Two specific mounts instead:
      # - /data/music read-only: the Lidarr library sync (libraryLidarrIndexer.js)
      #   calls readFileStats() on Lidarr-reported file paths to confirm
      #   availability -- needs to SEE the real music library, never writes to it.
      # - /data/downloads/complete/music read-write: where the yt-dlp
      #   downloader actually writes (matches the Settings > General
      #   "Download Folder" value, same staging folder SABnzbd/qBittorrent
      #   use for the rest of the *arr stack). Nothing else under /mnt/media
      #   needs to be visible to this container.
      - /mnt/media/music:/data/music:ro
      - /mnt/media/downloads/complete/music:/data/downloads/complete/music
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true