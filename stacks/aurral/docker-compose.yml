services:
  aurral:
    image: ghcr.io/lklynet/aurral:1.76.50
    container_name: aurral
    labels:
      # Opt into the manual dockercompose trigger defined in
      # stacks/wud/docker-compose.yml (2026-09-06). Pinned to the exact
      # current version for now -- v2.x moves the data mount from
      # /app/backend/data to /config (see the volumes comment below), and
      # there hasn't been a chance yet to review what else changed since
      # 1.76.50 (this pin was originally added 2026-06-14 for missing
      # artwork + MusicBrainz timeouts -- v2.8.0's changelog doesn't
      # mention either fix, so that hasn't been confirmed resolved).
      # Bump/remove this pin once ready to actually take the 2.x jump.
      - wud.tag.include=^1\.76\.50$$
      - wud.trigger.include=dockercompose.aurral
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /srv/docker/aurral/data:/app/backend/data
      # v2.x reads from /config instead of /app/backend/data (a real
      # breaking change per the v2.0.0 release notes). Same host folder
      # mounted at both paths so the data is already sitting where a
      # future v2.x expects it -- no separate migration step needed
      # whenever the pin above gets opened up.
      - /srv/docker/aurral/data:/config
      - /mnt/media/music/_aurral_weeklyflow:/data/weeklyflow
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true