services:
  rreading-glasses-db:
    mem_limit: 512m
    cpus: "1.0"
    image: postgres:17
    container_name: rreading-glasses-db
    labels:
      # Constrain WUD to the Postgres 17 line; otherwise it proposes 19beta3-trixie. This DB is ~197 GB - a major upgrade is a planned migration, not an update.
      - wud.tag.include=^17(\.\d+)*$$
    environment:
      POSTGRES_USER: rreading-glasses
      POSTGRES_PASSWORD: ${RG_POSTGRES_PASSWORD}
      POSTGRES_DB: rreading-glasses
    volumes:
      - /srv/docker/rreading-glasses/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - mediahub_internal

  rreading-glasses:
    # Switched from :latest to :hardcover 2026-09-05. :latest is the old
    # single-binary build (Goodreads scraping via --upstream, no auth
    # support) and hasn't been rebuilt since Feb 2026, well before
    # Hardcover started requiring an auth token on every call (broke
    # 2026-08-27). :hardcover is the maintainer's separate build variant
    # for the current Hardcover-backed upstream and natively supports
    # HARDCOVER_AUTH. Built 2026-08-17 -- current as of this change.
    image: blampe/rreading-glasses:hardcover
    container_name: rreading-glasses
    depends_on:
      - rreading-glasses-db
    entrypoint: ["/main", "serve"]
    command:
      - --verbose
    environment:
      POSTGRES_HOST: rreading-glasses-db
      POSTGRES_DATABASE: rreading-glasses
      POSTGRES_USER: rreading-glasses
      POSTGRES_PASSWORD: ${RG_POSTGRES_PASSWORD}
      # Required by :hardcover -- get one at hardcover.app/account/api.
      # Must include "Bearer ". See .env.example.
      HARDCOVER_AUTH: ${RG_HARDCOVER_AUTH}
    ports:
      - "8788:8788"
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - mediahub_internal

  calibre-content-server:
    image: wietsedv/calibre-server:latest
    container_name: calibre-content-server
    user: "1000:1000"
    command:
      - calibre-server
      - /library
      - --trusted-ips
      - 172.18.0.0/16
      - --enable-local-write
    environment:
      - TZ=America/Chicago
    volumes:
      # ext4 branch, not the mergerfs pool — see docs/calibre-library-on-ext4.md
      - /mnt/internal/ebooks/calibre-library:/library
      - /srv/docker/calibre-content-server/config:/config
    ports:
      - "18091:8080"
    restart: unless-stopped
    networks:
      - mediahub_internal

  bookshelf-ebooks:
    image: ghcr.io/pennydreadful/bookshelf:softcover
    container_name: bookshelf-ebooks
    environment:
      METADATA_URL: "http://rreading-glasses:8788"
      TZ: "America/Chicago"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /srv/docker/bookshelf/ebooks/config:/config
      - /mnt/media:/data
      # ext4 branch, not the mergerfs pool — see docs/calibre-library-on-ext4.md
      - /mnt/internal/ebooks/calibre-library:/library
      - /mnt/media/ebooks/bookshelf:/books
    ports:
      - "8787:8787"
    restart: unless-stopped
    networks:
      - mediahub_internal

  bookshelf-audiobooks:
    image: ghcr.io/pennydreadful/bookshelf:softcover
    container_name: bookshelf-audiobooks
    environment:
      METADATA_URL: "http://rreading-glasses:8788"
      TZ: "America/Chicago"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /srv/docker/bookshelf/audiobooks/config:/config
      - /mnt/media/audiobooks/bookshelf:/books
      - /mnt/media:/data
    ports:
      - "8789:8787"
    restart: unless-stopped
    networks:
      - mediahub_internal

networks:
  mediahub_internal:
    external: true
